name: Research pull (one off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research-pull
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Keep the EDGAR counts from the last run
        run: |
          mkdir -p research/out
          git fetch --depth=1 origin research-data && git show FETCH_HEAD:edgar_daily.csv > research/out/edgar_daily.csv || true
      - env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SKIP_EDGAR: "1"
        run: python research/pull.py
      - if: always()
        run: |
          cd research/out
          git init -q && git checkout -q -b research-data && git add . 
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "Research pull ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" research-data
