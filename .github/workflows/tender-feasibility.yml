name: Tender feasibility test

on:
  push:
    branches: [tender-lab]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Pull and extract
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python tender/feasibility.py
      - name: Publish results to the tender-results branch
        if: always()
        run: |
          cd tender/out
          git init -q
          git checkout -q -b tender-results
          git add .
          git -c user.name=github-actions -c user.email=actions@users.noreply.github.com commit -qm "Feasibility results ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tender-results
